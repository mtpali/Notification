name: Build APK

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore stable CI debug signing key
        run: base64 --decode .github/notification-ci-debug.keystore.b64 > app/ci-debug.keystore

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Worker
        run: node --test relay/test/relay.test.js

      - name: Android tests and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug

      - name: Build optimized signed APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload optimized APK
        uses: actions/upload-artifact@v4
        with:
          name: Notification-1.2.0-optimized-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Report APK size
        run: |
          stat --format='APK bytes %s' app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
          test -s app/build/outputs/mapping/release/mapping.txt
          awk '/^com\.mtpali\.notification.* -> / {print}' app/build/outputs/mapping/release/mapping.txt

      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Notification-1.2.0-validation
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
